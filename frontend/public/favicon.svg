<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="centsible-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Solid vibrant green background disc -->
  <circle cx="32" cy="32" r="32" fill="url(#centsible-bg)" />

  <!-- Outer rim accent -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- Inner coin circle -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

  <!-- Main cursive C character -->
  <path
    d="M 42 16 C 32 10 16 12 13 26 C 10 39 20 51 34 52 C 40 53 46 50 49 43"
    stroke="#ffffff"
    stroke-width="7.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Inner depth sweep -->
  <path
    d="M 39 20 C 32 15 21 16 18 27 C 15 37 22 47 34 49"
    stroke="rgba(255,255,255,0.4)"
    stroke-width="4"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Top curl flourish -->
  <path
    d="M 42 16 C 46 12 51 15 48 21"
    stroke="#ffffff"
    stroke-width="4.5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Bottom curl flourish -->
  <path
    d="M 49 43 C 53 48 51 52 46 50"
    stroke="#ffffff"
    stroke-width="4.5"
    stroke-linecap="round"
    fill="none"
  />
</svg>